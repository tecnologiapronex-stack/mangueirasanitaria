name: Build e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar na Hostinger?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      - run: npm run check:links
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true

  # Só roda quando alguém dispara manualmente com "publicar" marcado,
  # ou quando a variável DEPLOY_AUTOMATICO = "true" estiver definida no repositório.
  deploy:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publicar) ||
      (github.event_name == 'push' && vars.DEPLOY_AUTOMATICO == 'true')
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Enviar para a Hostinger por SSH (rsync)
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-65002}" "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-65002}" dist/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
